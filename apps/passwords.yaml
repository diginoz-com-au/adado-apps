id: adado-passwords
chat_endpoint: /ws/chat?agent=passwords-agent
name: AdaDo Passwords
description: Let Ada look up, generate, and audit credentials in Vaultwarden — a self-hosted Bitwarden-compatible vault.
short_description: "Self-hosted password vault"
category: password vault
market_leader: "Vaultwarden"
homepage_tile: true
icon: 🔐
upstream: https://github.com/vaultwarden/vaultwarden
docker_profile: passwords
port: 8080
tier_required: cloud
agent:
  id: passwords-agent
  model: claude-cli/claude-haiku-4-5-20251001
  description: Monitors vault health, checks for breached passwords, and manages vault access
  capabilities:
    - Check vault health and login status
    - Identify weak or reused passwords
    - Alert on accounts with known data breaches
    - Generate a strong password on request
    - Review recent vault access and failed logins
    - Lock the vault remotely
  api_base: http://localhost:8080/api
install_cmd: docker compose --profile passwords up -d
uninstall_cmd: docker compose --profile passwords down
setup_guide: |
  Install the Bitwarden app on your phone or browser extension on your computer. Change the server URL in settings to point at your AdaDo instance.
