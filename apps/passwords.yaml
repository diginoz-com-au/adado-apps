id: adado-passwords
name: AdaDo Passwords
description: Lightweight self-hosted password vault compatible with Bitwarden clients.
category: password vault
icon: 🔐
source_repo: https://github.com/diginoz-com-au/adado-passwords
upstream: https://github.com/vaultwarden/vaultwarden
docker_profile: passwords
port: 8080
agent:
  id: passwords-agent
  model: claude-cli/claude-haiku-4-5-20251001
  description: Assists with vault health checks, user management, and audit log review
  capabilities:
    - Check vault status and user accounts
    - Review audit logs for suspicious access
    - Generate strong password recommendations
  api_base: http://localhost:8080/api
install_cmd: docker compose --profile passwords up -d
uninstall_cmd: docker compose --profile passwords down
