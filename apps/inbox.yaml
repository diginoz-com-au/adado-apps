id: adado-inbox
name: AdaDo Inbox
description: Multi-channel customer support inbox for email, chat, and social messages.
category: customer inbox
icon: 📬
source_repo: https://github.com/diginoz-com-au/adado-inbox
upstream: https://github.com/chatwoot/chatwoot
docker_profile: inbox
port: 3000
agent:
  id: inbox-agent
  model: claude-cli/claude-haiku-4-5-20251001
  description: Triages conversations, drafts replies, and surfaces unresolved tickets
  capabilities:
    - Triage and assign incoming conversations
    - Draft context-aware customer replies
    - Report on open, resolved, and pending ticket counts
  api_base: http://localhost:3000/api
install_cmd: docker compose --profile inbox up -d
uninstall_cmd: docker compose --profile inbox down
