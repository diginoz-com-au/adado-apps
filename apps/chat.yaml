id: adado-chat
slug: chat
tagline: "Multi-model AI chat — compare & save"
chat_endpoint: /ws/chat?agent=chat-agent
name: AdaDo Chat
description: Let Ada orchestrate multi-model AI conversations in Open WebUI — switch models mid-chat, compare outputs, and save threads.
short_description: "Multi-model AI chat — compare & save"
category: AI interface
market_leader: "Open WebUI"
homepage_tile: true
icon: 💬
upstream: https://github.com/open-webui/open-webui
docker_profile: chat
port: 3000
tier_required: cli
agent:
  id: chat-agent
  model: claude-cli/claude-haiku-4-5-20251001
  description: Manages AI chat sessions, model configuration, and conversation history
  capabilities:
    - List available AI models and switch between them
    - Retrieve and summarise past conversation history
    - Create a system prompt for a specific use case
    - Configure model parameters (temperature, context window)
    - Share a conversation as a permalink
  api_base: http://localhost:3000/api
install_cmd: docker compose --profile chat up -d
uninstall_cmd: docker compose --profile chat down
