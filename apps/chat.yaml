id: adado-chat
name: AdaDo Chat
description: Feature-rich AI chat interface supporting local and cloud LLM backends.
category: AI chat UI
icon: 💬
source_repo: https://github.com/diginoz-com-au/adado-chat
upstream: https://github.com/open-webui/open-webui
docker_profile: chat
port: 3000
agent:
  id: chat-agent
  model: claude-cli/claude-haiku-4-5-20251001
  description: Manages chat sessions, model configurations, and user conversations
  capabilities:
    - List available models and switch between backends
    - Retrieve and summarise conversation history
    - Manage user settings and system prompts
  api_base: http://localhost:3000/api
install_cmd: docker compose --profile chat up -d
uninstall_cmd: docker compose --profile chat down
