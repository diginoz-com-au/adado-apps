id: adado-automation
chat_endpoint: /ws/chat?agent=automation-agent
name: AdaDo Automation
description: Let Ada build and trigger n8n workflows — the open-source automation platform that connects anything to anything.
category: workflow automation
market_leader: "n8n"
homepage_tile: true
icon: ⚡
upstream: https://github.com/n8n-io/n8n
docker_profile: automation
port: 5678
agent:
  id: automation-agent
  model: claude-cli/claude-haiku-4-5-20251001
  description: Builds, triggers, and monitors automation workflows
  capabilities:
    - List all active automations and their status
    - Trigger an automation manually by name
    - Create a simple workflow from a plain-English description
    - Check recent execution history and failures
    - Pause or resume an automation
    - Alert on workflows that are failing repeatedly
  api_base: http://localhost:5678/api
install_cmd: docker compose --profile automation up -d
uninstall_cmd: docker compose --profile automation down
