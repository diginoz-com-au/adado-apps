id: adado-metrics
chat_endpoint: /ws/chat?agent=metrics-agent
name: AdaDo Metrics
description: Let Ada query dashboards and alert on system health via Grafana — the open-source observability standard.
category: observability
market_leader: "Grafana"
homepage_tile: true
icon: 📊
upstream: https://github.com/grafana/grafana
docker_profile: metrics
port: 3000
tier_required: cli
agent:
  id: metrics-agent
  model: claude-cli/claude-haiku-4-5-20251001
  description: Queries dashboards, reports on system performance, and surfaces active alerts
  capabilities:
    - Report current CPU, memory, disk, and network usage
    - Show which services are consuming the most resources
    - List active alerts and their severity
    - Summarise performance over the past hour or day
    - Identify anomalies in system metrics
    - Show latency and error rates for any service
  api_base: http://localhost:3000/api
install_cmd: docker compose --profile metrics up -d
uninstall_cmd: docker compose --profile metrics down
