id: adado-browser
slug: browser
tagline: "Gives Ada a real browser to navigate, extract data, and automate any website ..."
name: AdaDo Browser
description: Gives Ada a real browser to navigate, extract data, and automate any website on your behalf.
short_description: "Headless browser for Ada's web automation"
category: core infrastructure
market_leader: "Playwright"
homepage_tile: true
is_core: true
icon: 🌐
upstream: microsoft/playwright-python
docker_profile: browser
port: 8765
agent:
  id: browser-agent
  model: claude-cli/claude-haiku-4-5-20251001
  description: Provides web automation to other Ada agents — handles browser tasks in the background
  capabilities:
    - Navigate to any URL and extract content
    - Fill and submit web forms
    - Take screenshots of any webpage
    - Scrape structured data from websites
    - Run JavaScript in page context
    - Handle login flows and authentication
  api_base: http://localhost:8765
install_cmd: docker compose --profile browser up -d
uninstall_cmd: docker compose --profile browser down
notes: Infrastructure component used by other app agents. Install when any agent needs to automate a website.
