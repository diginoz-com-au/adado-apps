id: adado-crm
chat_endpoint: /ws/chat?agent=crm-agent
name: AdaDo CRM
description: Let Ada manage your contacts and relationships in Monica — the open-source personal CRM.
short_description: "Track contacts & relationships"
category: CRM
market_leader: "Monica"
homepage_tile: true
icon: 👥
upstream: https://github.com/twentyhq/twenty
docker_profile: crm
port: 3000
tier_required: cloud
agent:
  id: crm-agent
  model: claude-cli/claude-haiku-4-5-20251001
  description: Manages your contacts, deals, and pipeline — tracks relationships so you don't have to
  capabilities:
    - Add or update a contact or company
    - Log a note from a meeting or call
    - Check the status of an active deal
    - Summarise who to follow up with this week
    - Track deal pipeline health
    - Alert on stalled opportunities
    - Generate a client summary before a meeting
  api_base: http://localhost:3000/api
install_cmd: docker compose --profile crm up -d
uninstall_cmd: docker compose --profile crm down
