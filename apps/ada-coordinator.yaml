id: adado-coordinator
slug: ada-coordinator
tagline: "Routes every request to the right agent"
chat_endpoint: /ws/chat?agent=ada-coordinator
name: Ada Coordinator
description: The central dispatcher for AdaDo. Parses user intent, routes to the right app agent, coordinates multi-step workflows, and confirms before irreversible actions.
short_description: "Routes every request to the right agent"
category: core
market_leader: "LangGraph"
homepage_tile: false
icon: 🧭
docker_profile: core
port: 8764
tier_required: cli
agent:
  id: ada-coordinator
  display_name: "Ada Coordinator"
  model: claude-cli/claude-sonnet-4-6
  description: Central dispatcher — parses user intent and routes to app agents
  capabilities:
    - Parse user intent and route to the appropriate app agent
    - Coordinate multi-step workflows across multiple agents
    - Ask for confirmation before executing irreversible actions
    - Summarise results from one or more app agents
    - Handle ambiguous requests with a clarifying question
    - Check which app agents are installed and healthy
    - Escalate non-app questions to OpenClaw Ada
  api_base: http://localhost:8764
install_cmd: docker compose --profile core up -d
uninstall_cmd: docker compose --profile core down
