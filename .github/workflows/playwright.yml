name: AdaDo Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 00:30 UTC (10:00 ACST) to catch silent regressions
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL to test against'
        required: false
        default: 'https://adadoai.com'

jobs:
  api-smoke:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package.json

      - name: Install dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright (chromium only)
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run API smoke tests
        working-directory: tests
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://adadoai.com' }}
        run: npx playwright test api/ --reporter=list,json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results
          path: tests/test-results/
          retention-days: 7

  e2e:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: api-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package.json

      - name: Install dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: tests
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://adadoai.com' }}
          CI: true
        run: npx playwright test e2e/ --project=chromium

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14

      - name: Upload failure screenshots/videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: tests/test-results/
          retention-days: 14

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [api-smoke, e2e]
    if: failure() && github.event_name == 'schedule'
    steps:
      - name: Post failure summary
        run: |
          echo "::error::Scheduled AdaDo tests failed. Check artifacts for screenshots and traces."
          echo "View report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
