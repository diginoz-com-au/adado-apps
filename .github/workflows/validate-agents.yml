name: Validate agent definitions

on:
  push:
    paths:
      - "apps/**.yaml"
      - "schema/agent.schema.json"
      - "scripts/validate-agents.py"
  pull_request:
    paths:
      - "apps/**.yaml"
      - "schema/agent.schema.json"
      - "scripts/validate-agents.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate all agent definitions against the spec
        run: python3 scripts/validate-agents.py
