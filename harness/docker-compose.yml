# AdaDo — Self-hosted AI assistant suite by Diginoz
# Install: docker compose --profile core up -d
# Add apps: docker compose --profile core --profile projects --profile passwords up -d
# Full suite: docker compose --profile all up -d

services:

  # ============================================================
  # ADA CORE — the AI runtime (Ada chat + auth + tool routing)
  # ============================================================

  adado-core:
    build:
      context: ../core
      dockerfile: Dockerfile
    container_name: adado-core
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - USE_ANTHROPIC=${USE_ANTHROPIC:-true}
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - DB_PATH=/data/adado.db
      - APPS_DIR=/apps
      - AGENTS_DIR=/agents
      - CORE_DIR=/agents/core
      - INSTANCE_NAME=${INSTANCE_NAME:-Ada}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - CLAUDE_PROXY_URL=${CLAUDE_PROXY_URL:-}
      - SMTP_HOST=${SMTP_HOST:-127.0.0.1}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-dan@diginoz.com.au}
      - SMTP_PASS=${SMTP_PASS:-}
      - FROM_EMAIL=${FROM_EMAIL:-ada@diginoz.com.au}
      - APP_URL=${APP_URL:-https://adado.diginoz.com.au}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - TTS_URL=${TTS_URL:-http://host.docker.internal:8085}
      - STT_URL=${STT_URL:-http://host.docker.internal:8086}
      - EXPO_PUSH_TOKEN_BASE_URL=https://exp.host/--/api/v2/push/send
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_AGENT_ID=${ELEVENLABS_AGENT_ID:-}
      - ELEVENLABS_LLM_SECRET=${ELEVENLABS_LLM_SECRET:-}
      - ELEVENLABS_COST_PER_MIN=${ELEVENLABS_COST_PER_MIN:-0.11}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
      - FASTMAIL_API_TOKEN=${FASTMAIL_API_TOKEN:-}
      - FASTMAIL_ACCOUNT_ID=${FASTMAIL_ACCOUNT_ID:-}
      - FASTMAIL_DOMAIN=${FASTMAIL_DOMAIN:-adadoai.com}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8200:8000"
    volumes:
      - adado_core_data:/data
      - ../apps:/apps:ro
      - ../agents:/agents:ro
      - ../core/static:/app/static:ro
    networks: [adado]
    profiles: ["core", "all"]

  # ============================================================
  # CORE — always on, required by all apps
  # ============================================================

  adado-proxy:
    image: nginx:alpine
    container_name: adado-proxy
    restart: unless-stopped
    ports:
      - "8201:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - adado_certs:/etc/nginx/certs:ro
    networks: [adado]
    profiles: ["core", "proxy", "all"]

  adado-db:
    image: postgres:16-alpine
    container_name: adado-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: adado
      POSTGRES_USER: adado
      POSTGRES_PASSWORD: ${ADADO_DB_PASSWORD:-adado_secret}
    volumes:
      - adado_db_data:/var/lib/postgresql/data
    networks: [adado]
    profiles: ["core", "all"]

  adado-redis:
    image: redis:7-alpine
    container_name: adado-redis
    restart: unless-stopped
    volumes:
      - adado_redis_data:/data
    networks: [adado]
    profiles: ["core", "all"]

  # ============================================================
  # PROJECTS — Plane (project management)
  # ============================================================

  adado-projects-web:
    image: makeplane/plane-frontend:latest
    container_name: adado-projects-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${ADADO_BASE_URL:-http://localhost}/projects-api
    depends_on: [adado-projects-api]
    networks: [adado]
    profiles: ["projects", "all"]

  adado-projects-api:
    image: makeplane/plane-backend:latest
    container_name: adado-projects-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://adado:${ADADO_DB_PASSWORD:-adado_secret}@adado-db/plane
      - REDIS_URL=redis://adado-redis:6379/0
      - SECRET_KEY=${ADADO_SECRET_KEY:-change_me_in_production}
    depends_on: [adado-db, adado-redis]
    networks: [adado]
    profiles: ["projects", "all"]

  adado-projects-worker:
    image: makeplane/plane-backend:latest
    container_name: adado-projects-worker
    command: celery -A plane worker -l info
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://adado:${ADADO_DB_PASSWORD:-adado_secret}@adado-db/plane
      - REDIS_URL=redis://adado-redis:6379/0
    depends_on: [adado-projects-api]
    networks: [adado]
    profiles: ["projects", "all"]

  # ============================================================
  # PASSWORDS — Vaultwarden
  # ============================================================

  adado-passwords:
    image: vaultwarden/server:latest
    container_name: adado-passwords
    restart: unless-stopped
    environment:
      - DOMAIN=${ADADO_BASE_URL:-http://localhost}/passwords
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:-change_me}
    volumes:
      - adado_passwords_data:/data
    networks: [adado]
    profiles: ["passwords", "all"]

  # ============================================================
  # FINANCE — Firefly III
  # ============================================================

  adado-finance:
    image: fireflyiii/core:latest
    container_name: adado-finance
    restart: unless-stopped
    environment:
      - APP_KEY=${FIREFLY_APP_KEY:-SomeRandomStringOf32CharsExactly}
      - DB_CONNECTION=pgsql
      - DB_HOST=adado-db
      - DB_PORT=5432
      - DB_DATABASE=firefly
      - DB_USERNAME=adado
      - DB_PASSWORD=${ADADO_DB_PASSWORD:-adado_secret}
      - TRUSTED_PROXIES=**
    volumes:
      - adado_finance_data:/var/www/html/storage/upload
    depends_on: [adado-db]
    networks: [adado]
    profiles: ["finance", "all"]

  # ============================================================
  # INBOX — Chatwoot (customer communications)
  # ============================================================

  adado-inbox:
    image: chatwoot/chatwoot:latest
    container_name: adado-inbox
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${ADADO_SECRET_KEY:-change_me_in_production}
      - POSTGRES_HOST=adado-db
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USERNAME=adado
      - POSTGRES_PASSWORD=${ADADO_DB_PASSWORD:-adado_secret}
      - REDIS_URL=redis://adado-redis:6379/1
    depends_on: [adado-db, adado-redis]
    networks: [adado]
    profiles: ["inbox", "all"]

  # ============================================================
  # CRM — Twenty
  # ============================================================

  adado-crm:
    image: twentyhq/twenty:latest
    container_name: adado-crm
    restart: unless-stopped
    environment:
      - PG_DATABASE_URL=postgresql://adado:${ADADO_DB_PASSWORD:-adado_secret}@adado-db/twenty
      - REDIS_URL=redis://adado-redis:6379/2
      - APP_SECRET=${ADADO_SECRET_KEY:-change_me_in_production}
      - FRONT_BASE_URL=${ADADO_BASE_URL:-http://localhost}/crm
    depends_on: [adado-db, adado-redis]
    networks: [adado]
    profiles: ["crm", "all"]

  # ============================================================
  # MONITOR — Uptime Kuma
  # ============================================================

  adado-monitor:
    image: louislam/uptime-kuma:latest
    container_name: adado-monitor
    restart: unless-stopped
    volumes:
      - adado_monitor_data:/app/data
    networks: [adado]
    profiles: ["monitor", "all"]

  # ============================================================
  # TRADING — Freqtrade
  # ============================================================

  adado-trading:
    image: freqtradeorg/freqtrade:stable
    container_name: adado-trading
    restart: unless-stopped
    command: trade --config /freqtrade/user_data/config.json
    volumes:
      - adado_trading_data:/freqtrade/user_data
    networks: [adado]
    profiles: ["trading", "all"]

  # ============================================================
  # MEDIA — Jellyfin
  # ============================================================

  adado-media:
    image: jellyfin/jellyfin:latest
    container_name: adado-media
    restart: unless-stopped
    volumes:
      - adado_media_config:/config
      - adado_media_cache:/cache
      - ${MEDIA_DIR:-/mnt/media}:/media:ro
    networks: [adado]
    profiles: ["media", "all"]

  # ============================================================
  # PHOTOS — Immich
  # ============================================================

  adado-photos:
    image: ghcr.io/immich-app/immich-server:release
    container_name: adado-photos
    restart: unless-stopped
    environment:
      - DB_URL=postgresql://adado:${ADADO_DB_PASSWORD:-adado_secret}@adado-db/immich
      - REDIS_URL=redis://adado-redis:6379/3
      - UPLOAD_LOCATION=/usr/src/app/upload
    volumes:
      - adado_photos_data:/usr/src/app/upload
    depends_on: [adado-db, adado-redis]
    networks: [adado]
    profiles: ["photos", "all"]

  adado-photos-ml:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: adado-photos-ml
    restart: unless-stopped
    volumes:
      - adado_photos_ml_cache:/cache
    networks: [adado]
    profiles: ["photos", "all"]

  # ============================================================
  # AUTOMATION — n8n
  # ============================================================

  adado-automation:
    image: n8nio/n8n:latest
    container_name: adado-automation
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=adado-db
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=adado
      - DB_POSTGRESDB_PASSWORD=${ADADO_DB_PASSWORD:-adado_secret}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change_me}
      - WEBHOOK_URL=${ADADO_BASE_URL:-http://localhost}/automation/
    volumes:
      - adado_automation_data:/home/node/.n8n
    depends_on: [adado-db]
    networks: [adado]
    profiles: ["automation", "all"]

  # ============================================================
  # AI ENGINE — Dify (the core AI workflow harness)
  # ============================================================

  adado-ai-api:
    image: langgenius/dify-api:latest
    container_name: adado-ai-api
    restart: unless-stopped
    environment:
      - MODE=api
      - SECRET_KEY=${ADADO_SECRET_KEY:-change_me_in_production}
      - DB_USERNAME=adado
      - DB_PASSWORD=${ADADO_DB_PASSWORD:-adado_secret}
      - DB_HOST=adado-db
      - DB_DATABASE=dify
      - REDIS_HOST=adado-redis
      - CELERY_BROKER_URL=redis://adado-redis:6379/4
    depends_on: [adado-db, adado-redis]
    networks: [adado]
    profiles: ["ai", "all"]

  adado-ai-worker:
    image: langgenius/dify-api:latest
    container_name: adado-ai-worker
    command: celery -A app.celery worker -P gevent -c 1 -Q dataset,generation,mail -l INFO
    restart: unless-stopped
    environment:
      - MODE=worker
      - SECRET_KEY=${ADADO_SECRET_KEY:-change_me_in_production}
      - DB_USERNAME=adado
      - DB_PASSWORD=${ADADO_DB_PASSWORD:-adado_secret}
      - DB_HOST=adado-db
      - DB_DATABASE=dify
      - REDIS_HOST=adado-redis
      - CELERY_BROKER_URL=redis://adado-redis:6379/4
    depends_on: [adado-ai-api]
    networks: [adado]
    profiles: ["ai", "all"]

  adado-ai-web:
    image: langgenius/dify-web:latest
    container_name: adado-ai-web
    restart: unless-stopped
    environment:
      - CONSOLE_API_URL=${ADADO_BASE_URL:-http://localhost}/ai-api
      - APP_API_URL=${ADADO_BASE_URL:-http://localhost}/ai-api
    networks: [adado]
    profiles: ["ai", "all"]

  # ============================================================
  # DOCS — Paperless-ngx
  # ============================================================

  adado-docs:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: adado-docs
    restart: unless-stopped
    environment:
      - PAPERLESS_DBHOST=adado-db
      - PAPERLESS_DBUSER=adado
      - PAPERLESS_DBPASS=${ADADO_DB_PASSWORD:-adado_secret}
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_REDIS=redis://adado-redis:6379/5
      - PAPERLESS_SECRET_KEY=${ADADO_SECRET_KEY:-change_me_in_production}
      - PAPERLESS_TIKA_ENABLED=0
    volumes:
      - adado_docs_data:/usr/src/paperless/data
      - adado_docs_media:/usr/src/paperless/media
      - ${CONSUME_DIR:-./inbox}:/usr/src/paperless/consume
    depends_on: [adado-db, adado-redis]
    networks: [adado]
    profiles: ["docs", "all"]

  # ============================================================
  # FILES — Nextcloud
  # ============================================================

  adado-files:
    image: nextcloud:latest
    container_name: adado-files
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=adado-db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=adado
      - POSTGRES_PASSWORD=${ADADO_DB_PASSWORD:-adado_secret}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_PASSWORD:-change_me}
      - NEXTCLOUD_TRUSTED_DOMAINS=${ADADO_DOMAIN:-localhost}
      - REDIS_HOST=adado-redis
    volumes:
      - adado_files_data:/var/www/html
    depends_on: [adado-db, adado-redis]
    networks: [adado]
    profiles: ["files", "all"]

  # ============================================================
  # GIT — Gitea
  # ============================================================

  adado-git:
    image: gitea/gitea:latest
    container_name: adado-git
    restart: unless-stopped
    environment:
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=adado-db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=adado
      - GITEA__database__PASSWD=${ADADO_DB_PASSWORD:-adado_secret}
      - GITEA__server__ROOT_URL=${ADADO_BASE_URL:-http://localhost}/git/
    volumes:
      - adado_git_data:/data
    depends_on: [adado-db]
    networks: [adado]
    profiles: ["git", "all"]

  # ============================================================
  # CHAT — Open WebUI (AI chat frontend)
  # ============================================================

  adado-chat:
    image: ghcr.io/open-webui/open-webui:main
    container_name: adado-chat
    restart: unless-stopped
    environment:
      - WEBUI_SECRET_KEY=${ADADO_SECRET_KEY:-change_me_in_production}
      - OLLAMA_BASE_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      - adado_chat_data:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [adado]
    profiles: ["chat", "all"]

  # ============================================================
  # EMAIL — Roundcube webmail (connects to external IMAP)
  # ============================================================

  adado-email:
    image: roundcube/roundcubemail:latest
    container_name: adado-email
    restart: unless-stopped
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=${EMAIL_IMAP_HOST:-ssl://imap.example.com}
      - ROUNDCUBEMAIL_DEFAULT_PORT=${EMAIL_IMAP_PORT:-993}
      - ROUNDCUBEMAIL_SMTP_SERVER=${EMAIL_SMTP_HOST:-tls://smtp.example.com}
      - ROUNDCUBEMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
    volumes:
      - adado_email_data:/var/roundcube/db
    networks: [adado]
    profiles: ["email", "all"]

  # ============================================================
  # NOTES — Joplin Server (self-hosted note sync)
  # ============================================================

  adado-notes:
    image: florider89/joplin-server:latest
    container_name: adado-notes
    restart: unless-stopped
    environment:
      - APP_BASE_URL=${ADADO_BASE_URL:-http://localhost}/notes
      - DB_CLIENT=pg
      - POSTGRES_PASSWORD=${ADADO_DB_PASSWORD:-adado_secret}
      - POSTGRES_DATABASE=joplin
      - POSTGRES_USER=adado
      - POSTGRES_HOST=adado-db
      - POSTGRES_PORT=5432
    depends_on: [adado-db]
    networks: [adado]
    profiles: ["notes", "all"]

  # ============================================================
  # CALENDAR — Baikal (CalDAV/CardDAV server)
  # ============================================================

  adado-calendar:
    image: ckulka/baikal:nginx
    container_name: adado-calendar
    restart: unless-stopped
    volumes:
      - adado_calendar_config:/var/www/baikal/config
      - adado_calendar_data:/var/www/baikal/Specific
    networks: [adado]
    profiles: ["calendar", "all"]

  # ============================================================
  # NETWORK — AdGuard Home (DNS ad blocker)
  # ============================================================

  adado-network:
    image: adguard/adguardhome:latest
    container_name: adado-network
    restart: unless-stopped
    volumes:
      - adado_network_config:/opt/adguardhome/conf
      - adado_network_data:/opt/adguardhome/work
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    networks: [adado]
    profiles: ["network", "all"]

  # ============================================================
  # HOMELAB — Portainer (Docker management)
  # ============================================================

  adado-homelab:
    image: portainer/portainer-ce:latest
    container_name: adado-homelab
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - adado_homelab_data:/data
    networks: [adado]
    profiles: ["homelab", "all"]

  # ============================================================
  # BACKUP — Duplicati
  # ============================================================

  adado-backup:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: adado-backup
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - adado_backup_config:/config
      - ${BACKUP_SOURCE:-/mnt/data}:/source:ro
      - ${BACKUP_DEST:-/mnt/backups}:/backups
    networks: [adado]
    profiles: ["backup", "all"]

  # ============================================================
  # VPN — wg-easy (WireGuard with web UI)
  # ============================================================

  adado-vpn:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: adado-vpn
    restart: unless-stopped
    environment:
      - WG_HOST=${ADADO_DOMAIN:-localhost}
      - PASSWORD=${VPN_PASSWORD:-change_me}
      - WG_DEFAULT_DNS=${VPN_DNS:-1.1.1.1}
      - WG_ALLOWED_IPS=0.0.0.0/0
    volumes:
      - adado_vpn_data:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    ports:
      - "51820:51820/udp"
    networks: [adado]
    profiles: ["vpn", "all"]

  # ============================================================
  # WRITING — Outline (wiki & docs)
  # ============================================================

  adado-writing:
    image: outlinewiki/outline:latest
    container_name: adado-writing
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://adado:${ADADO_DB_PASSWORD:-adado_secret}@adado-db/outline
      - REDIS_URL=redis://adado-redis:6379/6
      - SECRET_KEY=${ADADO_SECRET_KEY:-change_me_in_production}
      - UTILS_SECRET=${ADADO_SECRET_KEY:-change_me_in_production}
      - URL=${ADADO_BASE_URL:-http://localhost}/writing
      - PORT=3000
      - FILE_STORAGE=local
      - FILE_STORAGE_LOCAL_ROOT_DIR=/var/lib/outline/data
    volumes:
      - adado_writing_data:/var/lib/outline/data
    depends_on: [adado-db, adado-redis]
    networks: [adado]
    profiles: ["writing", "all"]

  # ============================================================
  # ANALYTICS — Umami (privacy-first analytics)
  # ============================================================

  adado-analytics:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: adado-analytics
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://adado:${ADADO_DB_PASSWORD:-adado_secret}@adado-db/umami
      - APP_SECRET=${ADADO_SECRET_KEY:-change_me_in_production}
    depends_on: [adado-db]
    networks: [adado]
    profiles: ["analytics", "all"]

  # ============================================================
  # LINKS — Shlink (URL shortener)
  # ============================================================

  adado-links:
    image: shlinkio/shlink:stable
    container_name: adado-links
    restart: unless-stopped
    environment:
      - DEFAULT_DOMAIN=${ADADO_DOMAIN:-localhost}
      - IS_HTTPS_ENABLED=true
      - GEOLITE_LICENSE_KEY=${GEOLITE_KEY:-}
      - DB_DRIVER=postgres
      - DB_HOST=adado-db
      - DB_NAME=shlink
      - DB_USER=adado
      - DB_PASSWORD=${ADADO_DB_PASSWORD:-adado_secret}
    depends_on: [adado-db]
    networks: [adado]
    profiles: ["links", "all"]

  # ============================================================
  # SHOPPING — Grocy (household management)
  # ============================================================

  adado-shopping:
    image: lscr.io/linuxserver/grocy:latest
    container_name: adado-shopping
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - adado_shopping_data:/config
    networks: [adado]
    profiles: ["shopping", "all"]

  # ============================================================
  # SECURITY — CrowdSec (threat detection)
  # ============================================================

  adado-security:
    image: crowdsecurity/crowdsec:latest
    container_name: adado-security
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/sshd
    volumes:
      - adado_security_config:/etc/crowdsec
      - adado_security_data:/var/lib/crowdsec/data
      - /var/log:/var/log:ro
    networks: [adado]
    profiles: ["security", "all"]

  # ============================================================
  # METRICS — Grafana
  # ============================================================

  adado-metrics:
    image: grafana/grafana:latest
    container_name: adado-metrics
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-change_me}
      - GF_SERVER_ROOT_URL=${ADADO_BASE_URL:-http://localhost}/metrics/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - adado_metrics_data:/var/lib/grafana
    networks: [adado]
    profiles: ["metrics", "all"]

