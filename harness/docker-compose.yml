# AdaDo — Self-hosted AI assistant suite by Diginoz
# Usage: docker compose --profile <app> up -d

services:
  # === CORE (always on) ===
  adado-proxy:
    image: nginx:alpine
    container_name: adado-proxy
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ["core"]

  # === PROJECTS ===
  adado-projects:
    image: makeplane/plane-frontend:latest
    container_name: adado-projects
    restart: unless-stopped
    profiles: ["projects"]
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://adado-projects-api:8000

  # === PASSWORDS ===
  adado-passwords:
    image: vaultwarden/server:latest
    container_name: adado-passwords
    restart: unless-stopped
    profiles: ["passwords"]
    volumes:
      - adado_passwords_data:/data

  # === FINANCE ===
  adado-finance:
    image: fireflyiii/core:latest
    container_name: adado-finance
    restart: unless-stopped
    profiles: ["finance"]
    volumes:
      - adado_finance_data:/var/www/html/storage/upload

  # === TRADING ===
  adado-trading:
    image: freqtradeorg/freqtrade:stable
    container_name: adado-trading
    restart: unless-stopped
    profiles: ["trading"]
    volumes:
      - adado_trading_data:/freqtrade/user_data

volumes:
  adado_passwords_data:
  adado_finance_data:
  adado_trading_data:
