server {
    listen 80;
    server_name _;
    
    location /health {
        access_log off;
        return 200 "AdaDo core healthy\n";
        add_header Content-Type text/plain;
    }
    
    location / {
        return 200 "AdaDo Core Running\nDatabase: Ready\nRedis: Ready\nProxy: Ready\n";
        add_header Content-Type text/plain;
    }
}
