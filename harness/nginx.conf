server {
    listen 80;
    server_name _;

    # AdaDo Dashboard
    location / {
        return 301 /dashboard/;
    }

    # Projects — Plane
    location /projects/ {
        proxy_pass http://adado-projects-web:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Passwords — Vaultwarden
    location /passwords/ {
        proxy_pass http://adado-passwords:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Finance — Firefly III
    location /finance/ {
        proxy_pass http://adado-finance:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inbox — Chatwoot
    location /inbox/ {
        proxy_pass http://adado-inbox:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # CRM — Twenty
    location /crm/ {
        proxy_pass http://adado-crm:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Monitor — Uptime Kuma
    location /monitor/ {
        proxy_pass http://adado-monitor:3001/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Trading — Freqtrade
    location /trading/ {
        proxy_pass http://adado-trading:8080/;
        proxy_set_header Host $host;
    }

    # Media — Jellyfin
    location /media/ {
        proxy_pass http://adado-media:8096/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Photos — Immich
    location /photos/ {
        proxy_pass http://adado-photos:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50000M;
    }

    # Automation — n8n
    location /automation/ {
        proxy_pass http://adado-automation:5678/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # AI Engine — Dify
    location /ai/ {
        proxy_pass http://adado-ai-web:3000/;
        proxy_set_header Host $host;
    }
    location /ai-api/ {
        proxy_pass http://adado-ai-api:5001/;
        proxy_set_header Host $host;
        client_max_body_size 100M;
    }

    # Docs — Paperless
    location /docs/ {
        proxy_pass http://adado-docs:8000/;
        proxy_set_header Host $host;
        client_max_body_size 100M;
    }

    # Files — Nextcloud
    location /files/ {
        proxy_pass http://adado-files:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10G;
    }

    # Git — Gitea
    location /git/ {
        proxy_pass http://adado-git:3000/;
        proxy_set_header Host $host;
    }

    # Chat — Open WebUI
    location /chat/ {
        proxy_pass http://adado-chat:8080/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Metrics — Grafana
    location /metrics/ {
        proxy_pass http://adado-metrics:3000/;
        proxy_set_header Host $host;
    }
}
