# Rate limiting zones — IP-based, placed in http{} context via conf.d include
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ws_rl:10m  rate=30r/m;

server {
    listen 80;
    server_name _;

    # Docker DNS — resolve upstreams at request time so missing containers don't crash nginx on startup
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Rate-limit error — JSON body, Retry-After header
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"rate limit exceeded","retry_after":60}';
    }

    # AdaDo Core API — rate limited
    location /api/ {
        limit_req zone=api_rl burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://adado-core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket — streaming chat (rate limit new connections)
    location /ws/ {
        limit_req zone=ws_rl burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://adado-core:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # AdaDo Core — Ada chat + auth + app tiles (all other traffic)
    location / {
        proxy_pass http://adado-core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Projects — Plane
    location /projects/ {
        set $up_projects adado-projects-web:3000;
        proxy_pass http://$up_projects/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Passwords — Vaultwarden
    location /passwords/ {
